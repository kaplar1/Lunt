# DFU over UART from the running application (MCUmgr / SMP protocol).
# Use together with uart-dfu.overlay, which moves MCUmgr to the second 
# virtual COM port so log output on the first port does not interference.

CONFIG_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y

# Command groups: OS (reset, echo) and Image (list, upload, test, confirm)
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_IMG=y

# Dependencies of MCUMgr
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y

# Image management: writes the uploaded image into slot 1
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y