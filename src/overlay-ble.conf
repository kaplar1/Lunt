# Bluetooth LE: Environemtal sensing service + firmware update over the air

CONFIG_BT=y
CONFIG_BT_PREIPHERAL=y
CONFIG_BT_DEVICE_NAME="LuntNode"

# Our Environmental Sensing Service (ESS) src/ble_ess.c
CONFIG_APP_BLE=y

# nRF Connect SDK helper: adds the MCUmgr SMP service over BLE plus the
# image-mangement pieces.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y

# BLE and MCUmgr work runs on the system workqueue; give it room
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048